<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Setup Display Room</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
        --bg: #071016;
        --panel: rgba(255, 255, 255, 0.06);
        --line: rgba(255, 255, 255, 0.18);
        --text: #f8fbff;
        --muted: #b7c4cf;
        --accent: #58d9ff;
        --focus: #ffd166;
        --danger: #ff6b6b;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter,
          "Segoe UI",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }

      .launcher {
        width: min(1180px, 100%);
        margin: 0 auto;
        padding: clamp(22px, 4vw, 52px);
      }

      .topbar {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: clamp(22px, 4vw, 44px);
      }

      h1 {
        margin: 0;
        font-size: clamp(34px, 5vw, 68px);
        font-weight: 900;
        line-height: 1;
      }

      .status {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: clamp(16px, 2vw, 24px);
        font-weight: 700;
        line-height: 1.35;
      }

      .reload-button,
      .room-button {
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }

      .reload-button {
        flex: 0 0 auto;
        min-height: 58px;
        padding: 0 24px;
        background: var(--panel);
        font-size: 18px;
        font-weight: 850;
      }

      .reload-button:focus-visible,
      .room-button:focus-visible {
        outline: 5px solid var(--focus);
        outline-offset: 4px;
      }

      .room-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: clamp(14px, 2.4vw, 26px);
      }

      .room-button {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        min-height: clamp(92px, 13vh, 148px);
        width: 100%;
        padding: clamp(18px, 2.6vw, 30px);
        background: #101820;
        text-align: left;
      }

      .room-button:hover,
      .room-button:focus-visible {
        border-color: rgba(88, 217, 255, 0.85);
        background: #122431;
      }

      .room-label {
        display: block;
        overflow-wrap: anywhere;
        font-size: clamp(24px, 3vw, 38px);
        font-weight: 920;
        line-height: 1.12;
      }

      .empty-state {
        min-height: 160px;
        padding: 28px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--muted);
        font-size: clamp(20px, 3vw, 32px);
        font-weight: 800;
        line-height: 1.3;
      }

      .launcher.error .status {
        color: var(--danger);
      }

      @media (max-width: 720px) {
        .topbar {
          display: block;
        }

        .reload-button {
          width: 100%;
          margin-top: 18px;
        }
      }
    </style>
  </head>
  <body>
    <main id="launcherRoot" class="launcher">
      <header class="topbar">
        <div>
          <h1>Setup Display Room</h1>
          <p id="statusText" class="status">Memuat daftar room...</p>
        </div>
        <button id="reloadButton" class="reload-button" type="button">Muat ulang</button>
      </header>

      <section id="roomGrid" class="room-grid" aria-label="Daftar display room"></section>
    </main>

    <script type="module" src="js/launcher.js"></script>
  </body>
</html>
